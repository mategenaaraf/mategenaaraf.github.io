<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحدي ماتيجي نعرف</title><link rel="stylesheet" href="main.css"><script>
if(location.search.indexOf("ep=")>-1&&location.hash.indexOf("ep=")===-1){try{history.replaceState(null,"",location.pathname+"#/"+location.search);}catch(e){}}
window.instinctFile=Object.freeze({
initialRoute:(function(){var h=location.hash.slice(1)||"/";try{return decodeURIComponent(h);}catch(e){return h;}})(),
route:function(p){if(typeof p==="string"&&p.charAt(0)==="/"&&p.indexOf("//")!==0&&p.length<=2048){try{history.replaceState(null,"",location.pathname+"#"+p);}catch(e){}}},
asset:function(u){return u;},
request:function(){return Promise.resolve({status:"unavailable"});},
live:undefined
});
</script></head><body><div id="root"></div><script src="main.js"></script></body></html>
