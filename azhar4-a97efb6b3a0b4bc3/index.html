<title>رحلة الأزهري الصغير</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{--g1:#14825a;--g2:#0b5d3b;--g3:#06361f;--ac:#ffd36a;margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;background:linear-gradient(180deg,var(--g3) 0%,var(--g2) 48%,var(--g1) 100%);background-attachment:fixed;transition:background .4s;color:#fff;min-height:100vh;overflow-x:hidden}
.stars{position:fixed;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 60%,#fff8,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff8,transparent),radial-gradient(2px 2px at 85% 15%,#fff8,transparent);animation:tw 4s infinite alternate}
@keyframes tw{to{opacity:.15}}
main{position:relative;max-width:520px;margin:auto;padding:64px 16px 40px}
h1{margin:6px 0;font-size:28px;text-align:center;color:#ffe08a;text-shadow:0 2px 12px #0006}
.sub{text-align:center;opacity:.85;margin-bottom:18px}
.card{background:#ffffff14;border:1px solid #ffffff30;border-radius:20px;padding:16px;margin:12px 0;backdrop-filter:blur(6px);animation:pop .4s both}
@keyframes pop{from{transform:scale(.92) translateY(14px);opacity:0}}
button{font:inherit;color:inherit;cursor:pointer}
.big{display:block;width:100%;padding:16px;border:0;border-radius:16px;background:linear-gradient(135deg,#ffd45e,#f0a81c);color:#3b2a00;font-weight:800;font-size:19px;margin:10px 0;box-shadow:0 6px 0 #a06f00,0 10px 20px #0005;transition:transform .1s}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 #a06f00}
.stat{display:flex;justify-content:space-around;text-align:center;font-size:15px}
.stat b{display:block;font-size:24px;color:#ffe08a}
.bar{height:12px;background:#0004;border-radius:9px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7dffb0,#ffe08a);transition:width .5s}
.q{font-size:24px;font-weight:800;line-height:1.9;text-align:center;margin:8px 0 12px;padding:14px 12px;border-radius:18px;background:linear-gradient(135deg,#ffffff30,#ffffff14);border:2px solid var(--ac);box-shadow:0 0 22px #0004,inset 0 0 18px #ffffff18;text-shadow:0 2px 6px #0005}
.ayah{font-family:"Amiri Quran","Scheherazade New","Noto Naskh Arabic",serif;font-size:26px;line-height:2}
.blank{display:inline-block;min-width:80px;border-bottom:3px dashed #ffe08a;color:#ffe08a}
.opt{display:block;width:100%;margin:7px 0;padding:9px 12px;line-height:1.7;border-radius:14px;border:2px solid #ffffff40;background:#ffffff12;font-size:19px;transition:.2s}
.opt.ayah{font-size:21px;font-weight:600}
.opt:active{transform:scale(.97)}
.opt.ok{background:#1fae62;border-color:#9dffc6;animation:bounce .5s}
.opt.no{background:#c0392b;border-color:#ffb3a8;animation:shake .4s}
@keyframes bounce{40%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.fb{min-height:30px;text-align:center;font-weight:700;margin:6px 0}
.grades{display:flex;gap:6px;justify-content:center;margin:8px 0}.gb{width:44px;height:44px;border-radius:50%;border:2px solid #ffd36a;background:#0b4a31;color:#ffd36a;font:700 18px inherit}.gb.on{background:#ffd36a;color:#0b4a31;transform:scale(1.12)}

body[data-g="1"]{--g1:#e0559f;--g2:#8e2fc0;--g3:#3d1263;--ac:#ffe27a}
body[data-g="2"]{--g1:#ff9248;--g2:#d3480f;--g3:#6a2204;--ac:#fff0a8}
body[data-g="3"]{--g1:#44a8ff;--g2:#1f5fd0;--g3:#0b2a6b;--ac:#ffe27a}
body[data-g="4"]{--g1:#14825a;--g2:#0b5d3b;--g3:#06361f;--ac:#ffd36a}
body[data-g="5"]{--g1:#25cbc8;--g2:#0e8a94;--g3:#06404e;--ac:#ffe27a}
body[data-g="6"]{--g1:#ef5a5f;--g2:#a8252d;--g3:#4a0b12;--ac:#ffd36a}
.big.m0{background:linear-gradient(135deg,#ffd45e,#f0a81c);box-shadow:0 6px 0 #a06f00,0 10px 20px #0005}
.big.m1{background:linear-gradient(135deg,#ff9a9a,#ff5d6c);color:#3a0008;box-shadow:0 6px 0 #a31d2c,0 10px 20px #0005}
.big.m2{background:linear-gradient(135deg,#8fdcff,#3aa6ff);color:#00213f;box-shadow:0 6px 0 #1a62a8,0 10px 20px #0005}
.big.m3{background:linear-gradient(135deg,#8af0b8,#2fcf7c);color:#00311a;box-shadow:0 6px 0 #14804a,0 10px 20px #0005}
.big.m4{background:linear-gradient(135deg,#d2b8ff,#9a6bff);color:#1d0048;box-shadow:0 6px 0 #5b36b5,0 10px 20px #0005}
.big.m5{background:linear-gradient(135deg,#ffb4e0,#ff6fbf);color:#4a002a;box-shadow:0 6px 0 #b0307e,0 10px 20px #0005}
.big.m0:active,.big.m1:active,.big.m2:active,.big.m3:active,.big.m4:active,.big.m5:active{transform:translateY(5px);box-shadow:0 1px 0 #0006}
.gb{border-color:var(--ac)!important;background:#0003!important;color:var(--ac)!important}.gb.on{background:var(--ac)!important;color:#222!important}
.gb:nth-child(1){--k:#ff7ac0}.gb:nth-child(2){--k:#ffa45e}.gb:nth-child(3){--k:#6cc3ff}.gb:nth-child(4){--k:#58e0a0}.gb:nth-child(5){--k:#47e3e0}.gb:nth-child(6){--k:#ff7b80}
.gb{border-color:var(--k)!important;color:#fff!important;background:var(--k)!important;color:#1a1a1a!important;opacity:.55}.gb.on{opacity:1;box-shadow:0 0 0 3px #fff,0 0 16px var(--k);background:var(--k)!important}
#opts .opt:nth-child(4n+1){border-color:#ffb0d4}#opts .opt:nth-child(4n+2){border-color:#9fd8ff}#opts .opt:nth-child(4n+3){border-color:#a9f0c8}#opts .opt:nth-child(4n+4){border-color:#ffe08a}
.bar i{background:linear-gradient(90deg,#ff7ac0,#ffd36a,#6cffb0)!important}
.lvl{color:var(--ac)}
.land{opacity:.5;position:fixed;left:0;right:0;bottom:0;height:34vh;z-index:0;pointer-events:none}.land svg{width:100%;height:100%;display:block}
.land .glow{fill:url(#hg)}.land .sil{fill:#000;fill-opacity:.42}.land .gold{fill:var(--ac);fill-opacity:.85}.land .lt{fill:var(--ac);fill-opacity:.55}
.hero{height:170px;margin:-4px 0 4px}.hero svg{width:100%;height:100%;display:block}.hero .sil{fill-opacity:.6}.hero .gold{fill-opacity:1}
#mute{position:fixed;top:10px;left:10px;z-index:60;width:46px;height:46px;border-radius:50%;border:2px solid #fff9;background:#0007;color:#fff;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 10px #0006}#mute.off{background:#b3261eaa;border-color:#ffd0cc}
.crescent{position:fixed;top:9%;left:9%;width:44px;height:44px;border-radius:50%;box-shadow:inset -13px 0 0 0 var(--ac);transform:rotate(-20deg);opacity:.85;pointer-events:none;filter:drop-shadow(0 0 10px var(--ac))}
.card{background:#00000030!important}
.src{font-size:11px;opacity:.85;text-align:center;margin-top:8px;color:#bff5d2}.src.unoff{color:#ffd9a0;background:#ff9d0033;border-radius:8px;padding:3px 6px}.ref{font-size:12px;opacity:.7;text-align:center;margin-top:6px}
.row{display:flex;gap:10px}.row .big{flex:1}
.stars3{color:#ffd45e;text-shadow:0 0 18px #ffd45e;font-size:54px;text-align:center;letter-spacing:6px}
.stars3 span{display:inline-block;animation:pop .6s both}
.hdr{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px;padding:11px 14px;border-radius:16px;background:linear-gradient(135deg,#231a6b,#5a24a8);border:2px solid #fff;color:#fff;font-size:20px;font-weight:800;line-height:1.5;text-align:center;box-shadow:0 6px 18px #0006,0 0 0 3px #ffffff30;animation:pop .35s both}.hdr svg{flex:none;color:#ffd36a}.hdr .sn{color:#ffd36a;font-size:23px;text-shadow:0 0 12px #ffd36a77}.hdr.long{font-size:17px}.hdr.long .sn{font-size:19px}
.tag{display:inline-block;margin-bottom:8px;font-size:12px;background:#0004;border-radius:10px;padding:2px 9px}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
.warn{font-size:13px;background:#ffe08a22;border:1px solid #ffe08a66;border-radius:12px;padding:8px 10px;margin-top:10px}
#inst{display:none}
body.flash{animation:fl .5s}@keyframes fl{0%{box-shadow:inset 0 0 0 0 #7dffb0}30%{box-shadow:inset 0 0 90px 30px #7dffb0aa}100%{box-shadow:inset 0 0 0 0 #0000}}
body.flashbad{animation:flb .45s}@keyframes flb{30%{box-shadow:inset 0 0 90px 30px #ff5a4acc}100%{box-shadow:inset 0 0 0 0 #0000}}
.float{position:fixed;z-index:11;font-weight:900;font-size:34px;color:#ffe08a;text-shadow:0 3px 10px #000a;pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes up{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-120px) scale(1.5);opacity:0}}
.banner{position:fixed;left:0;right:0;top:34%;z-index:12;text-align:center;font-size:44px;font-weight:900;color:#fff;text-shadow:0 0 24px #ffd45e,0 4px 0 #a06f00;pointer-events:none;animation:ban 1.5s ease-out forwards}
@keyframes ban{0%{transform:scale(.2) rotate(-8deg);opacity:0}20%{transform:scale(1.25) rotate(3deg);opacity:1}60%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.1) translateY(-40px);opacity:0}}
.bar i{box-shadow:0 0 14px #ffe08a;position:relative;overflow:hidden}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff9,transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.moon{font-size:70px;text-align:center;animation:fl2 3s ease-in-out infinite;filter:drop-shadow(0 0 18px #ffd45e)}
@keyframes fl2{50%{transform:translateY(-10px) rotate(6deg)}}
.fire{display:inline-block;animation:fire .5s infinite alternate}@keyframes fire{to{transform:scale(1.35) rotate(-8deg)}}
.lvl{text-align:center;color:#ffe08a;font-weight:800;margin:-4px 0 8px}
.opt.ok{box-shadow:0 0 28px #7dffb0,0 0 0 4px #7dffb0aa}
.cnt{font-size:56px;font-weight:900;color:#ffe08a;text-align:center;text-shadow:0 0 20px #ffd45e}
.shine{animation:pop .6s both,glow 1.4s .6s infinite alternate}@keyframes glow{to{filter:drop-shadow(0 0 22px #ffd45e)}}

.tmw{display:flex;align-items:center;gap:8px;margin:0 0 8px}.tmw .tb{flex:1;height:14px;border-radius:9px;background:#0005;overflow:hidden;border:1px solid #fff4}.tmw .tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7dffb0,#ffe08a);transition:width .12s linear}.tmw.low .tb i{background:linear-gradient(90deg,#ff6a5a,#ffb04a)}.tmw b{min-width:44px;text-align:center;font-size:22px;color:#ffe08a;background:#0006;border-radius:12px;padding:1px 6px}.tmw.low b{color:#ff8b80;animation:fire .35s infinite alternate}
.exh{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7a1fa2,#c2185b);border:2px solid #fff;border-radius:14px;padding:6px 10px;margin:0 0 8px;font-size:15px}
.exb{display:flex;align-items:center;gap:10px;width:100%;text-align:right;margin:8px 0;padding:12px 14px;border-radius:16px;border:2px solid #ffffff55;background:#ffffff14;font-size:17px;font-weight:700}.exb small{display:block;font-weight:500;opacity:.85;font-size:12.5px}.exb .ic{font-size:28px;flex:none}.exb.open{border-color:var(--ac);background:linear-gradient(135deg,#ffffff26,#ffffff10);box-shadow:0 0 18px #ffffff22}.exb.lock{opacity:.6}.exb .rt{margin-right:auto;text-align:center;flex:none;color:var(--ac);font-size:15px}
.ring{display:block;margin:6px auto;width:190px;height:190px}.ring circle{fill:none;stroke-width:14;stroke-linecap:round}.ring .bgc{stroke:#0005}.ring .fg{stroke:var(--ac);stroke-dasharray:515;stroke-dashoffset:515;transition:stroke-dashoffset 1.6s ease-out;filter:drop-shadow(0 0 8px var(--ac))}.ring text{fill:#fff;font-weight:900;text-anchor:middle}

const S=JSON.parse(localStorage.getItem("az4")||"null")||{seen:{},stars:0,streak:0,best:0,played:0,rounds:0};S.grade=S.grade||4;S.mute=!!S.mute;

B.islamic.push({q:"أي حكم من أحكام التجويد يُدرس في الصف الرابع في سبتمبر وأكتوبر؟",o:["أحكام الميم الساكنة","الإقلاب","الإخفاء الحقيقي","اللحن"],a:0,off:true,src:G});

B.islamic.push({q:"أي حكم يُدرس في الصف الرابع في فبراير ومارس؟",o:["اللامات السواكن","الإدغام","الإخفاء الحقيقي","اللحن"],a:0,off:true,src:G});
})();
const SUR=n=>B.surahs[n];
const allVerseText={};Object.keys(B.surahs).forEach(n=>B.surahs[n].verses.forEach((v,i)=>{(allVerseText[v]=allVerseText[v]||[]).push(n)}));

const GP=()=>B.G[S.grade];

  [...new Set(R.map(x=>x[0]))].forEach(n=>{const V=SUR(n).verses;V.forEach((v,i)=>{if(!inR(R,n,i))return;const w=WCOUNT(v);

}

 const off=true,src=`المقرر: توزيع منهج القرآن الكريم وتجويده للصف ${GN[S.grade]} الابتدائي 2026/2027 (رسمي، mtrl.azhar.gov.eg/education/curr-2026). نص الآيات: api.quran.com، قورن مع alquran.cloud. موضع الآية: سورة ${nm} آية ${i+1}`;
 if(k==="n"){const bad=V.filter((x,j)=>j!==i&&j!==i+1&&WCOUNT(x)<=28);return{id,kind:"verse",stem:v,ans:V[i+1],pool:shuf(bad).slice(0,2),tag:`ما الآية التي بعد هذه الآية من سورة ${nm}؟`,off,src}}

  const pool=[];V.forEach((x,j)=>{if(j===i)return;const y=words(x);if(y.length>=6){const t=y.slice(Math.ceil(y.length/2)).join(" ");if(Math.abs(y.length-ws.length)<=4&&t!==tail)pool.push(t)}});
  return{id,kind:"half",head,ans:tail,pool:shuf([...new Set(pool)]).slice(0,3),tag:`أكمل الآية من سورة ${nm}`,off,src}}

 if(k==="b"){const ws=words(v),cand=ws.map((w,j)=>j).filter(j=>j>=1&&ws[j].length>=4);const j=cand.length?cand[Math.random()*cand.length|0]:1;
  const bank=V.join(" ").split(" ").filter(x=>!WAQF.test(x)&&x!==ws[j]&&!ws.includes(x));
  return{id,kind:"blank",pre:ws.slice(0,j).join(" "),post:ws.slice(j+1).join(" "),ans:ws[j],pool:shuf([...new Set(bank)]).slice(0,3),tag:`أكمل الآية من سورة ${nm}`,off,src}}
}

function mkD(i){const d=REL.D[i],[g,mo,ty,q,a,w,sid]=d;
 const src=`غير رسمي: سؤال من نماذج امتحانات منشورة على موقع شبابيك (shbabbek.com/show/${sid})، ${mo[0]==="p"?"والموضوع مطابق لموضوعات الأزهر الرسمية 2026/2027 لشهر "+REL.months[mo]:"ضمن منهج الفصل الأول"}. يحتاج مراجعة معلم`;
 if(ty==="m")return{id:"d:"+i,sec:"islamic",kind:"mcq",q,opts:[a,...w],ans:0,off:false,src};

 return{id:"d:"+i,sec:"islamic",kind:"open",q,model:a,off:false,src};
}
const okQ=q=>q&&(q.kind==="tf"||q.kind==="mcq"||q.kind==="open"||(q.pool&&q.pool.length>=2));
function pick(sec,n){ // no repeats until the whole pool for this mode is used, then a new cycle starts
 const pool=ids(sec);
 const take=(from,k)=>{const r=[];for(const id of shuf(from)){if(r.length>=k)break;const q=mk(id);if(okQ(q))r.push(q);else S.seen[id]=1}return r};
 let out=take(pool.filter(q=>!S.seen[q]),n);
 if(out.length<n){pool.forEach(q=>delete S.seen[q]);const keep=out.map(q=>q.id);out=out.concat(take(pool.filter(q=>!keep.includes(q)),n-out.length))}
 out.forEach(q=>S.seen[q.id]=1);save();return out;
}

const relIdsM=(g,p)=>{const L=[];REL.D.forEach((d,i)=>{if(d[0]===g&&d[1]===p&&d[2]!=="o")L.push("d:"+i)});
 [...new Set(((REL.S[g]||{})[p])||[])].forEach(n=>{if(B.surahs[n])L.push(`R:${g}:${p}:N:${n}`)});return L};
const relGen=g=>{const L=[];REL.D.forEach((d,i)=>{if(d[0]===g&&d[1]==="t"&&d[2]!=="o")L.push("d:"+i)});if(g===4)B.islamic.forEach((x,i)=>{if(!META.test(x.q))L.push("i4:"+i)});return L};
const EXAMS0=[{id:"p1",t:"امتحان سبتمبر وأكتوبر",from:[2026,8,1],per:["p1"],qs:"p1"},{id:"p2",t:"امتحان نوفمبر",from:[2026,10,1],per:["p2"],qs:"p2"},{id:"p3",t:"امتحان ديسمبر",from:[2026,11,1],per:["p3"],qs:"p3"},{id:"t1",t:"امتحان الترم الأول (يناير)",from:[2027,0,1],per:["p1","p2","p3"],qs:"q1"},{id:"p4",t:"امتحان فبراير ومارس",from:[2027,1,1],per:[],qs:"p4"},{id:"p5",t:"امتحان أبريل",from:[2027,3,1],per:[],qs:"p5"},{id:"t2",t:"امتحان الترم الثاني (مايو)",from:[2027,4,1],per:[],qs:"q2"}];
const EXM={id:"p12",t:"امتحان أكتوبر ونوفمبر (مدمج)",from:[2026,9,1],per:["p1","p2"],qs:"p12"};

function exStats(g,ex){return S.ex[g+":"+ex.id]||null}
function drawExam(ex){
 const g=S.grade,key=g+":"+ex.id,rec=new Set(S.exr[key]||[]);
 const qp=ids(ex.qs).filter(i=>i[0]!=="x"&&i[0]!=="i"),rp=relPool(g,ex);
 const nR=rp.length?Math.min(rp.length,ex.per.length>1?9:8):0,nQ=NQ-nR;
 const taken=[],verses=new Set(),out=[];
 const vk=id=>{const p=id.split(":");return p[0]==="R"||p[0]==="d"||p[0]==="i4"?id:p[1]+":"+p[2]};
 const grab=(list,k)=>{let c=0;const pass=[shuf(list.filter(i=>!rec.has(i))),shuf(list.filter(i=>rec.has(i)))];
  for(const arr of pass)for(const id of arr){if(c>=k)break;if(taken.includes(id)||verses.has(vk(id)))continue;const q=id[0]==="R"?mkRel(id):mk(id);if(!okQ(q))continue;q.ex=1;out.push(q);taken.push(id);verses.add(vk(id));c++}

 const ex=EXI(id),st=exStats(S.grade,ex);if(!st)return;theme();

 app.innerHTML=`<h1>🎓 الشهادة</h1><input class="nm" id="nm" placeholder="اكتب اسم الطالب" value="${(S.name||"").replace(/"/g,"")}"><img class="cert" id="ci" alt="الشهادة"><div class="row"><a class="big m3" id="cdl" download="شهادة.png" style="text-decoration:none;text-align:center">💾 حفظ الصورة</a><button class="big" onclick="exams()">رجوع</button></div><div class="ref">اضغط مطولا على الصورة لحفظها أو مشاركتها</div>`;
 draw();$("#nm").oninput=e=>{S.name=e.target.value.slice(0,40);save();draw()};boom(120);sfx("win");muteBtn();
}
function setGrade(x){S.grade=x;save();home()}
let R;
function start(sec){sfx("start");const qs=pick(sec,10);if(!qs.length)return;R={qs,i:0,ok:0,streak:0,sec};show()}
function show(){
 const q=R.qs[R.i];let body="",opts=[];
 const ICON=`<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 6c-2-1.5-5-2-8-1.6v13c3-.4 6 .1 8 1.6 2-1.5 5-2 8-1.6v-13C17 4 14 4.5 12 6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 6v13" stroke="currentColor" stroke-width="1.8"/></svg>`;
 const tagHTML=(q.tag?`<div class="hdr ${q.tag.length>34?"long":""}">${ICON}<span>${q.tag.replace(/من سورة ([^؟]+)/,'من <b class="sn">سورة $1</b>')}</span></div>`:"");
 if(q.kind==="blank"){body=`<div class="q ayah">${q.pre} <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span> ${q.post}</div>`;opts=[q.ans,...q.pool];}
 else if(q.kind==="verse"){body=`<div class="q ayah">${q.stem}</div>`;opts=[q.ans,...q.pool];}
 else if(q.kind==="half"){body=`<div class="q ayah">${q.head} <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span></div>`;opts=[q.ans,...q.pool];}
 else if(q.kind==="surah"){body=`<div class="q ayah">${q.stem}</div>`;opts=[q.ans,...q.pool.slice(0,q.n-1)];}
 else if(q.kind==="open"){body=`<div class="q">${q.q}</div><div id="mdl" style="display:none;margin:6px 0;padding:10px;border-radius:14px;background:#1fae6233;border:2px solid #7dffb0;font-size:19px;line-height:1.8;text-align:center">${q.model}</div>`;opts=["👁 أظهر الإجابة"];}
 else{body=`<div class="q">${q.q}</div>`;opts=q.opts.slice();}
 const isText=["blank","verse","half"].includes(q.kind);
 const order=q.kind==="tf"?opts.map((o,i)=>i):shuf(opts.map((o,i)=>i));
 const srcHTML=`<div class="src ${q.off?"":"unoff"}">${q.off?"✔ رسمي":"⚠ غير رسمي"} · ${q.src||""}</div>`;
 app.innerHTML=`${R.ex?exBar():""}${tagHTML}<div class="card"><div class="stat"><div>سؤال ${R.i+1}/${R.qs.length}</div><div>${R.streak>=3?`<span class="fire">🔥</span>`:"🔥"} ${R.streak}</div><div>⭐ ${R.ok}</div></div><div class="bar"><i style="width:${R.i/R.qs.length*100}%"></i></div>${body}
 <div id="opts">${order.map(i=>`<button class="opt ${isText?"ayah":""}" data-i="${i}">${opts[i]}</button>`).join("")}</div><div class="fb" id="fb"></div>${srcHTML}</div>`;
 (()=>{const q0=document.querySelector(".q"),len=q0.textContent.length;q0.style.fontSize=(len<50?34:len<90?30:len<140?26:len<200?23:20)+"px";
  const os=[...document.querySelectorAll(".opt")],ml=Math.max(...os.map(o=>o.textContent.length));const f=ml<=25?24:ml<=50?21:ml<=90?18:ml<=140?16:14;os.forEach(o=>{o.style.fontSize=f+"px";if(f<=18)o.style.padding="7px 10px"})})();
 const correct=["blank","verse","half","surah","open"].includes(q.kind)?0:q.ans;
 const answer=(b,i)=>{
  if(R.tv){clearInterval(R.tv);R.tv=0}
  document.querySelectorAll(".opt").forEach(x=>x.onclick=null);
  const ok=b&&i===correct;
  if(R.ex){R.res.push({id:q.id,ok:!!ok,to:!b})}
  b&&b.classList.add(ok?"ok":"no");
  if(!ok&&q.kind!=="open")document.querySelector(`.opt[data-i="${correct}"]`).classList.add("ok");
  const rc=(b||document.querySelector(`.opt[data-i="${correct}"]`)).getBoundingClientRect();if(b)flash(ok);if(ok){const pts=10+Math.min(R.streak,5)*2;S.xp=(S.xp||0)+pts;floatTxt("+"+pts,rc.left+rc.width/2-20,rc.top);burstAt(rc.left+rc.width/2,rc.top+rc.height/2,70);R.ok++;R.streak++;S.streak=R.streak;S.best=Math.max(S.best,R.streak);(R.streak%3===0?(sfx("streak"),vib(30)):good());if(R.streak%3===0){boom(160);banner(`🔥 سلسلة ${R.streak}`);$("#fb").textContent=PRAISE[R.streak%5]}else $("#fb").textContent="✅ "+PRAISE[R.ok%5]}
  else{R.streak=0;bad();$("#fb").textContent=b?"❌ حاول مرة تانية في الجولة الجاية. الصح باللون الأخضر.":"⏰ انتهى الوقت. الصح باللون الأخضر."}
  setTimeout(()=>{R.i++;R.i<R.qs.length?show():end()},1500);
 };
 if(q.kind==="open"){const ob=document.querySelector(".opt");ob.onclick=()=>{$("#mdl").style.display="block";$("#opts").innerHTML=`<button class="opt" data-i="0">✅ عرفتها</button><button class="opt" data-i="1">❌ لم أعرفها</button>`;document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,+b.dataset.i))}}
 else document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,+b.dataset.i));
 if(R.ex){startTimer(()=>answer(null,-1))}
}
function end(){
 if(R.ex)return endExam();
 const n=R.qs.length,r=R.ok/n,st=r>=.9?3:r>=.6?2:r>=.3?1:0;S.stars+=st;S.rounds++;save();if(st>=2){boom(260);banner(st===3?"🏆 بطل!":"👏 أحسنت!")}sfx(st===3?"win":st>=1?"okend":"tryagain");
 setTimeout(()=>{const c=$("#cn");c&&countUp(c,R.ok)},0);app.innerHTML=`<h1>${st===3?"🏆 ممتاز!":st?"👏 أحسنت!":"💪 كمّل وهتتحسن"}</h1><div class="card"><div class="stars3">${[1,2,3].map(i=>`<span style="animation-delay:${i*.3}s">${i<=st?"★":"☆"}</span>`).join("")}</div><div class="cnt shine" dir="ltr"><span id="cn">0</span> / ${n}</div></div><div class="lvl">${lvl(S.xp||0)} · ${S.xp||0} نقطة</div>
 <div class="row"><button class="big" onclick="start('${R.sec}')">جولة جديدة</button><button class="big" onclick="home()">الرئيسية</button></div>`;
}
if(false);
home();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
