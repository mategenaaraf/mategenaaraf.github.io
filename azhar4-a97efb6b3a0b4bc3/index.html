*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{--g1:#14825a;--g2:#0b5d3b;--g3:#06361f;--ac:#ffd36a;margin:0;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;background:radial-gradient(circle at 50% 0,var(--g1),var(--g2) 55%,var(--g3));background-attachment:fixed;transition:background .4s;color:#fff;min-height:100vh;overflow-x:hidden}

.row{display:flex;gap:10px}.row .big{flex:1}
.stars3{color:#ffd45e;text-shadow:0 0 18px #ffd45e;font-size:54px;text-align:center;letter-spacing:6px}

.float{position:fixed;z-index:11;font-weight:900;font-size:34px;color:#ffe08a;text-shadow:0 3px 10px #000a;pointer-events:none;animation:up 1.1s ease-out forwards}
@keyframes up{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-120px) scale(1.5);opacity:0}}
.banner{position:fixed;left:0;right:0;top:34%;z-index:12;text-align:center;font-size:44px;font-weight:900;color:#fff;text-shadow:0 0 24px #ffd45e,0 4px 0 #a06f00;pointer-events:none;animation:ban 1.5s ease-out forwards}
@keyframes ban{0%{transform:scale(.2) rotate(-8deg);opacity:0}20%{transform:scale(1.25) rotate(3deg);opacity:1}60%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.1) translateY(-40px);opacity:0}}
.bar i{box-shadow:0 0 14px #ffe08a;position:relative;overflow:hidden}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff9,transparent);animation:sh 1.2s infinite}

.moon{font-size:70px;text-align:center;animation:fl2 3s ease-in-out infinite;filter:drop-shadow(0 0 18px #ffd45e)}
@keyframes fl2{50%{transform:translateY(-10px) rotate(6deg)}}
.fire{display:inline-block;animation:fire .5s infinite alternate}@keyframes fire{to{transform:scale(1.35) rotate(-8deg)}}

<script>
const $=s=>document.querySelector(s),app=$("#app");
const S=JSON.parse(localStorage.getItem("az4")||"null")||{seen:{},stars:0,streak:0,best:0,played:0,rounds:0};S.grade=S.grade||4;
const save=()=>localStorage.setItem("az4",JSON.stringify(S));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const WAQF=/^[ۖۗۚۛۘۙۜ]+$/;
const words=t=>t.split(" ").reduce((r,w)=>{WAQF.test(w)&&r.length?r[r.length-1]+=" "+w:r.push(w);return r},[]);
// ---- question bank (lazy: ids are listed, each question is built from the verified verse text only when asked)
const B=window.BANK,WCOUNT=v=>words(v).length;

(function(){const O="رسمي: توزيع موضوعات التربية الدينية للصف الرابع الفصل الأول 2026/2027 (mtrl.azhar.gov.eg/education/curr-2026، مقررات ابتدائي دفعة ثالثة). الربط بالمجال مأخوذ من الجدول نفسه";
const F=["العقيدة","العبادات","القرآن والتفسير","السير والشخصيات","القيم والأخلاق"];
const T=[["الإيمان بالرسل",0],["الزكاة",1],["سورة الانفطار (تلاوة وحفظ وتفسير)",2],["بناء المسجد النبوي وأبو أيوب الأنصاري رضي الله عنه",3],["إكرام الضيف",4],["وظيفة الرسل",0],["سورة التكوير",2],["شروط الزكاة",1],["المؤاخاة بين المهاجرين والأنصار وعبد الرحمن بن عوف",3],["الاعتماد على النفس",4],["بين النبوة والرسالة",0],["أنواع الزكاة",1],["سورة عبس",2],["وثيقة المدينة وعثمان بن عفان رضي الله عنه",3],["السخاء",4]];
T.forEach(([t,k])=>{const o=F.slice();B.islamic.push({q:"في أي مجال يدخل موضوع «"+t+"» في منهج التربية الدينية للصف الرابع؟",o:o,a:k,off:true,src:O})});
const G="رسمي: توزيع منهج القرآن وتجويده للصف الرابع 2026/2027 (mtrl.azhar.gov.eg/education/curr-2026)";
B.islamic.push({q:"أي حكم من أحكام التجويد يُدرس في الصف الرابع في سبتمبر وأكتوبر؟",o:["أحكام الميم الساكنة","الإقلاب","الإخفاء الحقيقي","اللحن"],a:0,off:true,src:G});
B.islamic.push({q:"أي موضوع من التجويد يُدرس في الصف الرابع في أبريل؟",o:["التفخيم والترقيق","الإظهار الحلقي","الإقلاب","مراتب القراءة"],a:0,off:true,src:G});
B.islamic.push({q:"أي حكم يُدرس في الصف الرابع في فبراير ومارس؟",o:["اللامات السواكن","الإدغام","الإخفاء الحقيقي","اللحن"],a:0,off:true,src:G});
})();
const SUR=n=>B.surahs[n];
const allVerseText={};Object.keys(B.surahs).forEach(n=>B.surahs[n].verses.forEach((v,i)=>{(allVerseText[v]=allVerseText[v]||[]).push(n)}));
const NAMES=Object.values(B.surahs).map(s=>s.name).concat(B.extraNames);
const GN={1:"الأول",2:"الثاني",3:"الثالث",4:"الرابع",5:"الخامس",6:"السادس"};
const GP=()=>B.G[S.grade];
function ranges(sec){const P=GP();if(sec==="q1")return P.filter(p=>p.term===1).flatMap(p=>p.r);if(sec==="q2")return P.filter(p=>p.term===2).flatMap(p=>p.r);const p=P.find(p=>p.id===sec);return p?p.r:P.flatMap(p=>p.r)}
const inR=(R,n,i)=>R.some(([s,a,b])=>s===n&&i+1>=a&&(b===0||i+1<=b));
const gSurahs=()=>[...new Set(GP().flatMap(p=>p.r.map(x=>x[0])))];
const ISL=g=>g===4?B.islamic:(B.islG&&B.islG[g])||[];
function ids(sec){
 const L=[];const R=ranges(sec);
 if(sec==="islamic"||sec==="mix") ISL(S.grade).forEach((x,i)=>L.push(`i${S.grade}:`+i));
 if(sec!=="islamic"){
  [...new Set(R.map(x=>x[0]))].forEach(n=>{const V=SUR(n).verses;V.forEach((v,i)=>{if(!inR(R,n,i))return;const w=WCOUNT(v);
   if(w>=4&&i+1<V.length&&WCOUNT(V[i+1])<=28)L.push(`n:${n}:${i}`);
   if(w>=7)L.push(`h:${n}:${i}`);
   if(w>=6&&allVerseText[v].length===1)L.push(`s:${n}:${i}`);
   if(w>=5)L.push(`b:${n}:${i}`);});});
  if(S.grade===4&&(sec==="quran"||sec==="mix")) B.exam.forEach((x,i)=>L.push("x:"+i));
 }
 return L;
}
function mk(id){const q=mk0(id);if(q&&q.pool){q.pool=[...new Set(q.pool)].filter(o=>o!==q.ans)}return q}
function mk0(id){
 const p=id.split(":"),k=p[0];
 if(k[0]==="i"){const x=ISL(+k.slice(1))[p[1]];return{id,sec:"islamic",kind:x.tf?"tf":"mcq",q:x.q,opts:x.tf?["صح","خطأ"]:x.o,ans:x.tf?(x.a?0:1):x.a,off:x.off,src:x.src}}
 if(k==="x"){const x=B.exam[p[1]];return{id,kind:"surah",stem:x.text,ans:x.name,pool:x.opts.filter(o=>o!==x.name),n:3,tag:"أكمل الآية ثم تخير اسم السورة",off:false,src:"صيغة السؤال ونصه من نموذج شبابيك للصف الرابع (غير رسمي). نص الآية: api.quran.com"}}
 const n=+p[1],i=+p[2],V=SUR(n).verses,v=V[i],nm=SUR(n).name;
 const off=true,src=`المقرر: توزيع منهج القرآن الكريم وتجويده للصف ${GN[S.grade]} الابتدائي 2026/2027 (رسمي، mtrl.azhar.gov.eg/education/curr-2026). نص الآيات: api.quran.com، قورن مع alquran.cloud. موضع الآية: سورة ${nm} آية ${i+1}`;
 if(k==="n"){const bad=V.filter((x,j)=>j!==i&&j!==i+1&&WCOUNT(x)<=28);return{id,kind:"verse",stem:v,ans:V[i+1],pool:shuf(bad).slice(0,2),tag:`ما الآية التي بعد هذه الآية من سورة ${nm}؟`,off,src}}
 if(k==="h"){const ws=words(v),c=Math.ceil(ws.length/2),head=ws.slice(0,c).join(" "),tail=ws.slice(c).join(" ");
  const pool=[];V.forEach((x,j)=>{if(j===i)return;const y=words(x);if(y.length>=6){const t=y.slice(Math.ceil(y.length/2)).join(" ");if(Math.abs(y.length-ws.length)<=4&&t!==tail)pool.push(t)}});
  return{id,kind:"half",head,ans:tail,pool:shuf([...new Set(pool)]).slice(0,3),tag:`أكمل الآية من سورة ${nm}`,off,src}}
 if(k==="s"){const gn=gSurahs().map(m=>SUR(m).name).filter(x=>x!==nm),pool=shuf(gn).slice(0,3);if(pool.length<3)pool.push(...shuf(NAMES.filter(x=>x!==nm&&!pool.includes(x))).slice(0,3-pool.length));return{id,kind:"surah",stem:v,ans:nm,pool,n:4,tag:"في أي سورة وردت هذه الآية؟",off,src}}
 if(k==="b"){const ws=words(v),cand=ws.map((w,j)=>j).filter(j=>j>=1&&ws[j].length>=4);const j=cand.length?cand[Math.random()*cand.length|0]:1;
  const bank=V.join(" ").split(" ").filter(x=>!WAQF.test(x)&&x!==ws[j]&&!ws.includes(x));
  return{id,kind:"blank",pre:ws.slice(0,j).join(" "),post:ws.slice(j+1).join(" "),ans:ws[j],pool:shuf([...new Set(bank)]).slice(0,3),tag:`أكمل الآية من سورة ${nm}`,off,src}}
}
const okQ=q=>q&&(q.kind==="tf"||q.kind==="mcq"||(q.pool&&q.pool.length>=2));
function pick(sec,n){ // no repeats until the whole pool for this mode is used, then a new cycle starts
 const pool=ids(sec);
 const take=(from,k)=>{const r=[];for(const id of shuf(from)){if(r.length>=k)break;const q=mk(id);if(okQ(q))r.push(q);else S.seen[id]=1}return r};
 let out=take(pool.filter(q=>!S.seen[q]),n);
 if(out.length<n){pool.forEach(q=>delete S.seen[q]);const keep=out.map(q=>q.id);out=out.concat(take(pool.filter(q=>!keep.includes(q)),n-out.length))}
 out.forEach(q=>S.seen[q.id]=1);save();return out;
}
// ---- sound / effects
let AC;const beep=(f,d=.15,t="sine",v=.15)=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d)}catch(e){}};
const good=()=>{[660,880,1100].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*90));navigator.vibrate&&navigator.vibrate(30)};
const bad=()=>{beep(180,.3,"sawtooth",.1);navigator.vibrate&&navigator.vibrate([60,40,60])};
const cv=$("#cv"),cx=cv.getContext("2d");let P=[];
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function boom(n=120){for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,c:`hsl(${Math.random()*360},90%,60%)`,s:5+Math.random()*6,l:90});if(P.length===n)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l-->0);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s)});if(P.length)requestAnimationFrame(tick)}

const bg=$("#bg"),bx=bg.getContext("2d");let SP=[];
function fitbg(){bg.width=innerWidth;bg.height=innerHeight;SP=Array.from({length:40},()=>({x:Math.random()*bg.width,y:Math.random()*bg.height,r:1+Math.random()*3,v:.2+Math.random()*.6,p:Math.random()*6}))}fitbg();addEventListener("resize",fitbg);
(function loop(t){bx.clearRect(0,0,bg.width,bg.height);SP.forEach(s=>{s.y-=s.v;if(s.y<-5)s.y=bg.height+5;bx.globalAlpha=.4+.4*Math.sin(t/400+s.p);bx.fillStyle="#ffe9a8";bx.beginPath();bx.arc(s.x,s.y,s.r,0,7);bx.fill()});requestAnimationFrame(loop)})(0);
function burstAt(x,y,n=60){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=3+Math.random()*9;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,c:`hsl(${Math.random()*360},95%,62%)`,s:5+Math.random()*7,l:80})}if(P.length===n)tick()}
function floatTxt(txt,x,y){const e=document.createElement("div");e.className="float";e.textContent=txt;e.style.left=x+"px";e.style.top=y+"px";document.body.appendChild(e);setTimeout(()=>e.remove(),1200)}
function banner(txt){const e=document.createElement("div");e.className="banner";e.textContent=txt;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
function flash(ok){document.body.classList.remove("flash","flashbad");void document.body.offsetWidth;document.body.classList.add(ok?"flash":"flashbad")}
const PRAISE=["ما شاء الله!","بارك الله فيك!","أحسنت!","ممتاز!","رائع!"];
const LEVELS=[[0,"مبتدئ 🌱"],[30,"مجتهد 📗"],[100,"حافظ صغير 📖"],[250,"نجم الأزهر 🌟"],[500,"بطل القرآن 🏆"]];
const lvl=x=>LEVELS.filter(l=>x>=l[0]).pop()[1];
function countUp(el,to){let n=0;const iv=setInterval(()=>{n++;el.textContent=n;if(n>=to)clearInterval(iv)},60)}
// ---- screens
let deferred;addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;const b=$("#inst");b&&(b.style.display="block")});
function home(){
 const g=S.grade,P=GP();
 const qn=ids("quran").length,isn=ISL(g).length;
 app.innerHTML=`<div class="moon">🌙</div><h1>رحلة الأزهري الصغير</h1><div class="sub">تدريب القرآن الكريم والتربية الإسلامية، الصف ${GN[g]} الابتدائي</div>
 <div class="grades">${[1,2,3,4,5,6].map(x=>`<button class="gb ${x===g?"on":""}" onclick="setGrade(${x})">${x}</button>`).join("")}</div>
 <div class="lvl">${lvl(S.xp||0)} · ${S.xp||0} نقطة</div><div class="card stat"><div><b>⭐ ${S.stars}</b>نجوم</div><div><b>🔥 ${S.best}</b>أفضل سلسلة</div><div><b>${S.rounds}</b>جولات</div></div>
 <button class="big" onclick="start('q1')">📖 القرآن، الترم الأول</button><button class="big" onclick="start('q2')">📖 القرآن، الترم الثاني</button><button class="big" onclick="start('quran')">📖 القرآن، المقرر كله</button><div class="warn" style="margin:6px 0">حسب شهور المنهج الرسمي 2026/2027</div>${P.map(p=>`<button class="big" onclick="start('${p.id}')">🗓️ ${p.t}</button>`).join("")}
 ${isn?`<button class="big" onclick="start('islamic')">🕌 التربية الإسلامية</button><button class="big" onclick="start('mix')">🎲 جولة مشكلة</button>`:`<div class="warn">التربية الإسلامية لهذا الصف قيد الإعداد.</div>`}
 <button class="big" id="inst" onclick="deferred&&deferred.prompt()">📲 ثبّت اللعبة على الموبايل</button>
 <div class="warn">نسخة تجريبية خاصة. بنك القرآن للصف ${GN[g]}: ${qn} سؤال من مقرر الأزهر الرسمي 2026/2027. أسئلة التربية الإسلامية (${isn}) ${g===4?"بعضها من نموذج رسمي وبعضها غير رسمي (معلّم بوضوح)":""} وتحتاج مراجعة معلم قبل النشر.</div>
 <div class="ref">أسئلتك لا تتكرر حتى ينتهي البنك. الأسئلة والاختيارات بترتيب عشوائي.</div>`;
 if(deferred)$("#inst").style.display="block";
 theme();document.querySelectorAll("#app .big:not(#inst)").forEach((b,i)=>b.classList.add("m"+i%6));
}
function theme(){const g=S.grade;document.body.dataset.g=g;const m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute("content",{1:"#8e2fc0",2:"#d3480f",3:"#1f5fd0",4:"#0b5d3b",5:"#0e8a94",6:"#a8252d"}[g])}
function setGrade(x){S.grade=x;save();home()}
let R;
function start(sec){const qs=pick(sec,10);if(!qs.length)return;R={qs,i:0,ok:0,streak:0,sec};show()}
function show(){
 const q=R.qs[R.i];let body="",opts=[];
 const tagHTML=(q.tag?`<div class="tag">${q.tag}</div>`:"");
 if(q.kind==="blank"){body=`${tagHTML}<div class="q ayah">${q.pre} <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span> ${q.post}</div>`;opts=[q.ans,...q.pool];}
 else if(q.kind==="verse"){body=`${tagHTML}<div class="q ayah">${q.stem}</div>`;opts=[q.ans,...q.pool];}
 else if(q.kind==="half"){body=`${tagHTML}<div class="q ayah">${q.head} <span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;</span></div>`;opts=[q.ans,...q.pool];}
 else if(q.kind==="surah"){body=`${tagHTML}<div class="q ayah">${q.stem}</div>`;opts=[q.ans,...q.pool.slice(0,q.n-1)];}
 else{body=`<div class="q">${q.q}</div>`;opts=q.opts.slice();}
 const isText=["blank","verse","half"].includes(q.kind);
 const order=q.kind==="tf"?opts.map((o,i)=>i):shuf(opts.map((o,i)=>i));
 const srcHTML=`<div class="src ${q.off?"":"unoff"}">${q.off?"✔ رسمي":"⚠ غير رسمي"} · ${q.src||""}</div>`;
 app.innerHTML=`<div class="card"><div class="stat"><div>سؤال ${R.i+1}/${R.qs.length}</div><div>${R.streak>=3?`<span class="fire">🔥</span>`:"🔥"} ${R.streak}</div><div>⭐ ${R.ok}</div></div><div class="bar"><i style="width:${R.i/R.qs.length*100}%"></i></div>${body}
 <div id="opts">${order.map(i=>`<button class="opt ${isText?"ayah":""}" data-i="${i}">${opts[i]}</button>`).join("")}</div><div class="fb" id="fb"></div>${srcHTML}</div>`;
 const correct=["blank","verse","half","surah"].includes(q.kind)?0:q.ans;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".opt").forEach(x=>x.onclick=null);
  const i=+b.dataset.i,ok=i===correct;
  b.classList.add(ok?"ok":"no");
  if(!ok)document.querySelector(`.opt[data-i="${correct}"]`).classList.add("ok");
  const rc=b.getBoundingClientRect();flash(ok);if(ok){const pts=10+Math.min(R.streak,5)*2;S.xp=(S.xp||0)+pts;floatTxt("+"+pts,rc.left+rc.width/2-20,rc.top);burstAt(rc.left+rc.width/2,rc.top+rc.height/2,70);R.ok++;R.streak++;S.streak=R.streak;S.best=Math.max(S.best,R.streak);good();if(R.streak%3===0){boom(160);banner(`🔥 سلسلة ${R.streak}`);$("#fb").textContent=PRAISE[R.streak%5]}else $("#fb").textContent="✅ "+PRAISE[R.ok%5]}
  else{R.streak=0;bad();$("#fb").textContent="❌ حاول مرة تانية في الجولة الجاية. الصح باللون الأخضر."}
  setTimeout(()=>{R.i++;R.i<R.qs.length?show():end()},1500);
 });
}
function end(){
 const n=R.qs.length,r=R.ok/n,st=r>=.9?3:r>=.6?2:r>=.3?1:0;S.stars+=st;S.rounds++;save();if(st>=2){boom(260);banner(st===3?"🏆 بطل!":"👏 أحسنت!")}if(st===3)[0,300,600].forEach(t=>setTimeout(()=>good(),t));
 setTimeout(()=>{const c=$("#cn");c&&countUp(c,R.ok)},0);app.innerHTML=`<h1>${st===3?"🏆 ممتاز!":st?"👏 أحسنت!":"💪 كمّل وهتتحسن"}</h1><div class="card"><div class="stars3">${[1,2,3].map(i=>`<span style="animation-delay:${i*.3}s">${i<=st?"★":"☆"}</span>`).join("")}</div><div class="cnt shine" dir="ltr"><span id="cn">0</span> / ${n}</div></div><div class="lvl">${lvl(S.xp||0)} · ${S.xp||0} نقطة</div>
 <div class="row"><button class="big" onclick="start('${R.sec}')">جولة جديدة</button><button class="big" onclick="home()">الرئيسية</button></div>`;
}
if(false);
home();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
